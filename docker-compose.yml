# ============================================================
# Test Platform — Production Docker Compose
# 支持 8000+ 并发用户
# ============================================================
version: '3.8'

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

services:

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: testplatform
      POSTGRES_PASSWORD: testplatform
      POSTGRES_DB: testplatform
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testplatform']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # ── Flask Application (Gunicorn) ──────────────────────────────────
  flask:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATABASE_URI: postgresql://testplatform:testplatform@postgres:5432/testplatform
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: '20'
      DB_MAX_OVERFLOW: '40'
      UPLOAD_FOLDER: /app/uploads
      LOG_FOLDER: /app/logs
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    logging: *default-logging
    # Gunicorn 启动命令（8 workers × eventlet）
    command: >
      gunicorn -k eventlet -w 8 -b 0.0.0.0:5000
      --worker-connections 2000
      --max-requests 10000 --max-requests-jitter 1000
      --access-logfile - --error-logfile -
      run:app

  # ── Celery Worker (异步任务执行) ──────────────────────────────────
  celery-worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://testplatform:testplatform@postgres:5432/testplatform
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    command: celery -A app.services.celery_app worker -l info -c 4
    logging: *default-logging

  # ── Celery Beat (定时任务调度) ────────────────────────────────────
  celery-beat:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://testplatform:testplatform@postgres:5432/testplatform
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    command: celery -A app.services.celery_app beat -l info
    logging: *default-logging

  # ── Nginx (反向代理 + 静态文件) ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - flask
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/app/static:ro
      - uploads:/app/uploads:ro
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  uploads:
  logs:
